name: Verify archived results
on: [push, pull_request]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-audit.txt
      - run: python -m pip install -r requirements-audit.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/verify_artifacts.py
      - run: python scripts/verify_baseline_results.py
      - run: python experiments/offline/gripper_semantics.py > /dev/null
